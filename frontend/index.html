<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FoundIT — Nile University Lost &amp; Found</title>
    <meta
      name="description"
      content="Lost something on campus? Found something? FoundIT connects Nile University students, lecturers, and staff to reunite lost items with their owners."
    />
    <link rel="canonical" href="https://founditapp.nedochipublications.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FoundIT" />
    <meta property="og:title" content="FoundIT — Nile University Lost & Found" />
    <meta
      property="og:description"
      content="Lost something on campus? Found something? FoundIT connects Nile University students, lecturers, and staff to reunite lost items with their owners."
    />
    <meta property="og:url" content="https://founditapp.nedochipublications.com/" />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FoundIT",
        "url": "https://founditapp.nedochipublications.com/",
        "description": "Lost something on campus? Found something? FoundIT connects Nile University students, lecturers, and staff to reunite lost items with their owners.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any browser",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NGN" }
      }
    </script>

    <!-- Apply the student's chosen app color before the first paint, so there is no flash of the default look. -->
    <script>
      try {
        var look = JSON.parse(localStorage.getItem("foundit_theme") || "{}");
        if (look && /^[a-z]+$/.test(look.theme || "")) document.documentElement.setAttribute("data-theme", look.theme);
        if (localStorage.getItem("foundit_doodles_still") === "1") document.documentElement.setAttribute("data-still", "");
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // the Home Screen icon follows the last SAVED color (never a preview): point the manifest at it straight away
      try {
        var saved = localStorage.getItem("foundit_saved_theme");
        if (saved && saved !== "classic" && /^[a-z]+$/.test(saved)) {
          document.querySelector('link[rel="manifest"]').href = "/manifests/" + saved + ".json";
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FoundIT" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA_MEASUREMENT_ID%');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
